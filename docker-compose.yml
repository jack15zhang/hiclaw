services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: hiclaw
      POSTGRES_USER: hiclaw
      POSTGRES_PASSWORD: hiclaw_dev
    ports:
      - "5432:5432"
    volumes:
      - hiclaw_postgres:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  hiclaw_postgres:
